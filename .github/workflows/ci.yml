# Lint and test the Python package, then typecheck + test the Cloudflare Worker (free-tier safe: no deploy here).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (editable) and dev tools
        run: pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest tests/ -q

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            cloudflare/package-lock.json
            video-ai/package-lock.json

      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm ci

      # Worker bundles ../../video-ai (planner, recipe schema, zod)
      - name: Install video-ai dependencies
        working-directory: video-ai
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: cloudflare
        run: npx tsc --noEmit

      - name: Worker tests (node --test)
        working-directory: cloudflare
        run: npm test
