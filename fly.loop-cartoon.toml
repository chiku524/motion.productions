# Cartoon loop — named-subject cel shots, window extraction. Deploy from repository root:
#   fly apps create motion-loop-cartoon   # first time only
#   fly deploy --config fly.loop-cartoon.toml
#
# Opt-in only (extra D1 writes). Local equivalent:
#   docker compose -f docker-compose.local.yml --profile cartoon up -d --build
app = "motion-loop-cartoon"
primary_region = "iad"

kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  dockerfile = "Dockerfile"

[deploy]
  wait_timeout = "10m"

[env]
  API_BASE = "https://motion.productions"
  LOOP_EXTRACTION_FOCUS = "window"
  LOOP_STATIC_FOCUS = "none"
  LOOP_WORKFLOW_TYPE = "cartoon"
  LOOP_WORKER_OFFSET_SECONDS = "45"
  LOOP_DELAY_SECONDS = "120"
  LOOP_DURATION_SECONDS = "2.5"
  HEALTH_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 2
    hard_limit = 4

  [[http_service.checks]]
    grace_period = "45s"
    interval = "60s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
