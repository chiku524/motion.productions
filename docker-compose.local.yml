# Local compute fleet — Docker image fleet on your CPU.
#
# Quick start (from repo root):
#   cp .env.example .env          # set MOTION_API_SECRET
#   docker compose -f docker-compose.local.yml up -d --build webjobs procedural-render
#
# Free-tier Core 4 loops (recommended on Cloudflare Free + D1):
#   docker compose -f docker-compose.local.yml --profile free up -d --build
#
# Full loops including exploiter (heavier D1 write load):
#   docker compose -f docker-compose.local.yml --profile loops-full up -d --build
#
# Legacy alias: --profile loops == Core 4 (same as free)
#   docker compose -f docker-compose.local.yml --profile loops up -d --build
#
# Video AI Node FFmpeg (recipe engine):
#   docker compose -f docker-compose.local.yml --profile video-ai up -d --build
#
# See docs/LOCAL_COMPUTE.md for tunnels and GPU notes.

name: motion-local

x-d1-budget: &d1-budget
  # Shared hard cap on D1 rows written per UTC day across ALL containers (Cloudflare Free = 100,000/day incl. index writes).
  # Ledger lives on the shared ./knowledge volume and resets at 00:00 UTC. Weights (percent): interpret 15, sound 10,
  # explorer 30, balanced 30, everything else 5 (10% is unallotted reserve). 0 disables the gate. See docs/D1_FREE_TIER.md.
  D1_DAILY_WRITE_BUDGET: ${D1_DAILY_WRITE_BUDGET:-70000}
  WRITE_BUDGET_DIR: /app/knowledge/write_budget
  WRITE_BUFFER_DIR: /app/knowledge/write_buffer
  WRITE_BUFFERS: ${WRITE_BUFFERS:-1}
  # Idle this many seconds when the allowance is spent (0 = keep working locally, just stop posting)
  WRITE_BUDGET_SLEEP_WHEN_EXHAUSTED_S: ${WRITE_BUDGET_SLEEP_WHEN_EXHAUSTED_S:-0}

x-python-worker: &python-worker
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    API_BASE: ${API_BASE:-https://motion.productions}
    MOTION_API_SECRET: ${MOTION_API_SECRET:-}
    HEALTH_PORT: "8080"
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
    <<: *d1-budget
    # Free-tier D1: small weighted chunks + pause between POSTs (blends cost ~3 queries each)
    DISCOVERIES_MAX_ITEMS: ${DISCOVERIES_MAX_ITEMS:-36}
    DISCOVERIES_CHUNK_PAUSE_SECONDS: ${DISCOVERIES_CHUNK_PAUSE_SECONDS:-1.0}
  volumes:
    # Live-edit Python without rebuild (deps / Dockerfile changes still need --build)
    - ./src:/app/src
    - ./scripts:/app/scripts
    - ./knowledge:/app/knowledge
  restart: unless-stopped

services:
  # Fulfills pending /api/jobs (authenticated clients / scripts)
  webjobs:
    <<: *python-worker
    environment:
      <<: *d1-budget
      D1_BUDGET_NAME: webjobs
      API_BASE: ${API_BASE:-https://motion.productions}
      MOTION_API_SECRET: ${MOTION_API_SECRET:-}
      HEALTH_PORT: "8080"
      PYTHONUNBUFFERED: "1"
      WORKER_START_SCRIPT: generate_bridge
      LOOP_CAMERA_VARIATION: ${LOOP_CAMERA_VARIATION:-1}
      BRIDGE_LEARN: "1"
      BRIDGE_INTERVAL_SECONDS: "20"
      LOOP_EXTRACTION_FOCUS: all
      DISCOVERIES_MAX_ITEMS: ${DISCOVERIES_MAX_ITEMS:-36}
      DISCOVERIES_CHUNK_PAUSE_SECONDS: ${DISCOVERIES_CHUNK_PAUSE_SECONDS:-1.0}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Video AI engine=procedural → POST /render → MP4
  procedural-render:
    <<: *python-worker
    environment:
      <<: *d1-budget
      D1_BUDGET_NAME: procedural-render
      API_BASE: ${API_BASE:-https://motion.productions}
      MOTION_API_SECRET: ${MOTION_API_SECRET:-}
      PYTHONUNBUFFERED: "1"
      WORKER_START_SCRIPT: procedural_render
      LOOP_CAMERA_VARIATION: ${LOOP_CAMERA_VARIATION:-1}
      PORT: "8080"
      HEALTH_PORT: "8080"
      DISCOVERIES_MAX_ITEMS: ${DISCOVERIES_MAX_ITEMS:-36}
      DISCOVERIES_CHUNK_PAUSE_SECONDS: ${DISCOVERIES_CHUNK_PAUSE_SECONDS:-1.0}
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Core 4 (free): pure color exploration
  explorer:
    <<: *python-worker
    profiles: ["free", "loops", "loops-full"]
    environment:
      <<: *d1-budget
      D1_BUDGET_NAME: explorer
      DISCOVERY_FLUSH_INTERVAL_S: ${DISCOVERY_FLUSH_INTERVAL_S:-120}   # coalesce count bumps / novel cells for 2 min, then one merged POST
      DISCOVERY_FLUSH_MAX_ITEMS: ${DISCOVERY_FLUSH_MAX_ITEMS:-72}
      LINGUISTIC_FLUSH_INTERVAL_S: ${LINGUISTIC_FLUSH_INTERVAL_S:-900}
      API_BASE: ${API_BASE:-https://motion.productions}
      MOTION_API_SECRET: ${MOTION_API_SECRET:-}
      HEALTH_PORT: "8080"
      PYTHONUNBUFFERED: "1"
      LOOP_EXTRACTION_FOCUS: frame
      LOOP_STATIC_FOCUS: color
      LOOP_WORKFLOW_TYPE: explorer
      # One shared content-novelty store for every loop container (bind mount ./knowledge); merge-safe, ~5000 clips
      NOVELTY_STORE_DIR: /app/knowledge/novelty
      NOVELTY_STORE_MAX: ${NOVELTY_STORE_MAX:-5000}
      # Small rotating per-container JSONL metrics log (python scripts/loop_metrics.py)
      LOOP_METRICS_DIR: /app/knowledge/metrics
      LOOP_METRICS_NAME: explorer
      # Exact 8-bit colour survey (docs/COLOR_SURVEY.md): lossless local clips, never published, disjoint stride per container.
      # explorer = stride 0, balanced = stride 1 of COLOR_CONTAINER_COUNT (keep it at the number of surveying containers).
      LOOP_COLOR_SURVEY: ${LOOP_COLOR_SURVEY:-1}
      LOOP_COLOR_QUEUE: ${LOOP_COLOR_SURVEY:-1}
      COLOR_CELLS_DIR: /app/knowledge/color_cells
      CONTAINER_INDEX: "0"
      CONTAINER_COUNT: ${COLOR_CONTAINER_COUNT:-2}
      # D1 sync of coverage chunks (32 rows max per sync; migration 0101 applied 2026-10-27). Set COLOR_SYNC=0 to disable
      COLOR_SYNC: ${COLOR_SYNC:-1}
      LOOP_CAMERA_VARIATION: ${LOOP_CAMERA_VARIATION:-1}
      LOOP_WORKER_OFFSET_SECONDS: "0"
      LOOP_DELAY_SECONDS: "15"
      LOOP_DURATION_SECONDS: "1"
      DISCOVERIES_MAX_ITEMS: "36"
      DISCOVERIES_CHUNK_PAUSE_SECONDS: "1.0"
    ports:
      - "8083:8080"

  # Opt-in only: second color frame worker (extra D1 write pressure)
  exploiter:
    <<: *python-worker
    profiles: ["loops-full"]
    environment:
      <<: *d1-budget
      D1_BUDGET_NAME: exploiter
      DISCOVERY_FLUSH_INTERVAL_S: ${DISCOVERY_FLUSH_INTERVAL_S:-120}   # coalesce count bumps / novel cells for 2 min, then one merged POST
      DISCOVERY_FLUSH_MAX_ITEMS: ${DISCOVERY_FLUSH_MAX_ITEMS:-72}
      LINGUISTIC_FLUSH_INTERVAL_S: ${LINGUISTIC_FLUSH_INTERVAL_S:-900}
      API_BASE: ${API_BASE:-https://motion.productions}
      MOTION_API_SECRET: ${MOTION_API_SECRET:-}
      HEALTH_PORT: "8080"
      PYTHONUNBUFFERED: "1"
      LOOP_EXTRACTION_FOCUS: frame
      LOOP_STATIC_FOCUS: color
      LOOP_WORKFLOW_TYPE: exploiter
      NOVELTY_STORE_DIR: /app/knowledge/novelty
      NOVELTY_STORE_MAX: ${NOVELTY_STORE_MAX:-5000}
      LOOP_METRICS_DIR: /app/knowledge/metrics
      LOOP_METRICS_NAME: exploiter
      LOOP_CAMERA_VARIATION: ${LOOP_CAMERA_VARIATION:-1}
      LOOP_WORKER_OFFSET_SECONDS: "25"
      LOOP_DELAY_SECONDS: "15"
      LOOP_DURATION_SECONDS: "1"
      DISCOVERIES_MAX_ITEMS: "36"
      DISCOVERIES_CHUNK_PAUSE_SECONDS: "1.0"
    ports:
      - "8084:8080"

  # Core 4 (free): window / blended + narrative
  balanced:
    <<: *python-worker
    profiles: ["free", "loops", "loops-full"]
    environment:
      <<: *d1-budget
      D1_BUDGET_NAME: balanced
      DISCOVERY_FLUSH_INTERVAL_S: ${DISCOVERY_FLUSH_INTERVAL_S:-120}   # coalesce count bumps / novel cells for 2 min, then one merged POST
      DISCOVERY_FLUSH_MAX_ITEMS: ${DISCOVERY_FLUSH_MAX_ITEMS:-72}
      LINGUISTIC_FLUSH_INTERVAL_S: ${LINGUISTIC_FLUSH_INTERVAL_S:-900}
      API_BASE: ${API_BASE:-https://motion.productions}
      MOTION_API_SECRET: ${MOTION_API_SECRET:-}
      HEALTH_PORT: "8080"
      PYTHONUNBUFFERED: "1"
      LOOP_EXTRACTION_FOCUS: window
      LOOP_WORKFLOW_TYPE: main
      NOVELTY_STORE_DIR: /app/knowledge/novelty
      NOVELTY_STORE_MAX: ${NOVELTY_STORE_MAX:-5000}
      LOOP_METRICS_DIR: /app/knowledge/metrics
      LOOP_METRICS_NAME: balanced
      # Exact 8-bit colour survey (docs/COLOR_SURVEY.md): lossless local clips, never published, disjoint stride per container.
      # explorer = stride 0, balanced = stride 1 of COLOR_CONTAINER_COUNT (keep it at the number of surveying containers).
      LOOP_COLOR_SURVEY: ${LOOP_COLOR_SURVEY:-1}
      LOOP_COLOR_QUEUE: ${LOOP_COLOR_SURVEY:-1}
      COLOR_CELLS_DIR: /app/knowledge/color_cells
      CONTAINER_INDEX: "1"
      CONTAINER_COUNT: ${COLOR_CONTAINER_COUNT:-2}
      # D1 sync of coverage chunks (32 rows max per sync; migration 0101 applied 2026-10-27). Set COLOR_SYNC=0 to disable
      COLOR_SYNC: ${COLOR_SYNC:-1}
      LOOP_CAMERA_VARIATION: ${LOOP_CAMERA_VARIATION:-1}
      LOOP_STATIC_FOCUS: "none"
      LOOP_WORKER_OFFSET_SECONDS: "30"
      LOOP_DELAY_SECONDS: "15"
      LOOP_DURATION_SECONDS: "1"
      DISCOVERIES_MAX_ITEMS: "36"
      DISCOVERIES_CHUNK_PAUSE_SECONDS: "1.0"
    ports:
      - "8085:8080"

  # Core 4 (free): interpretation + linguistic
  interpret:
    <<: *python-worker
    profiles: ["free", "loops", "loops-full"]
    environment:
      <<: *d1-budget
      D1_BUDGET_NAME: interpret
      WRITE_BUDGET_SLEEP_WHEN_EXHAUSTED_S: ${INTERPRET_SLEEP_WHEN_EXHAUSTED_S:-900}   # idle once the allowance is spent
      INTERPRET_FLUSH_INTERVAL_S: ${INTERPRET_FLUSH_INTERVAL_S:-600}   # only novel prompts+shapes are POSTed (batched); the rest go to a local JSONL
      INTERPRET_FLUSH_MAX_ITEMS: ${INTERPRET_FLUSH_MAX_ITEMS:-10}
      LINGUISTIC_FLUSH_INTERVAL_S: ${LINGUISTIC_FLUSH_INTERVAL_S:-900}
      LINGUISTIC_FLUSH_MAX_ITEMS: ${LINGUISTIC_FLUSH_MAX_ITEMS:-40}
      API_BASE: ${API_BASE:-https://motion.productions}
      MOTION_API_SECRET: ${MOTION_API_SECRET:-}
      HEALTH_PORT: "8080"
      PYTHONUNBUFFERED: "1"
      WORKER_START_SCRIPT: interpret_loop
      INTERPRET_DELAY_SECONDS: "90"
    ports:
      - "8086:8080"

  # Core 4 (free): pure sound
  sound:
    <<: *python-worker
    profiles: ["free", "loops", "loops-full"]
    environment:
      <<: *d1-budget
      D1_BUDGET_NAME: sound
      WRITE_BUDGET_SLEEP_WHEN_EXHAUSTED_S: ${SOUND_SLEEP_WHEN_EXHAUSTED_S:-900}
      DISCOVERY_FLUSH_INTERVAL_S: ${SOUND_FLUSH_INTERVAL_S:-600}   # post only novel sound cells: one capped POST every 10 min
      DISCOVERY_FLUSH_MAX_ITEMS: ${SOUND_FLUSH_MAX_ITEMS:-24}
      API_BASE: ${API_BASE:-https://motion.productions}
      MOTION_API_SECRET: ${MOTION_API_SECRET:-}
      HEALTH_PORT: "8080"
      PYTHONUNBUFFERED: "1"
      WORKER_START_SCRIPT: sound_loop
      SOUND_LOOP_DELAY_SECONDS: "75"
      SOUND_LOOP_DURATION_SECONDS: "2.5"
      DISCOVERIES_MAX_ITEMS: ${SOUND_POST_MAX_ITEMS:-12}   # per-POST cap
      DISCOVERIES_CHUNK_PAUSE_SECONDS: "1.0"
    ports:
      - "8087:8080"

  # Node + FFmpeg recipe renderer (Video AI engine=recipe)
  video-ai-render:
    profiles: ["video-ai"]
    build:
      context: .
      dockerfile: Dockerfile.video-ai
    environment:
      PORT: "8080"
      VIDEO_AI_RENDER_SECRET: ${VIDEO_AI_RENDER_SECRET:-}
    ports:
      - "8788:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
